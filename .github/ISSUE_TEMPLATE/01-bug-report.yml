name: Bug Report
description: Report a bug or unexpected behavior
title: '[Bug]: '
labels: ['bug', 'needs-triage']
assignees: []

body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported already
          required: true
        - label: I have read the [documentation](https://github.com/maximseshuk/payload-plugin-sitemap#readme)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: Tell us what happened, what you expected, and how to reproduce the issue
      placeholder: |
        What happened:
        What you expected:
        Steps to reproduce:
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Plugin Configuration
      description: Share your plugin setup (**remove API keys and sensitive data**)
      placeholder: |
        ```typescript
        sitemap({
          siteUrl: 'https://example.com',
          sources: [{ type: 'collection', collection: 'posts', url: '/blog/:slug' }],
        })
        ```
      render: typescript
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Environment Info
      description: |
        Paste output from `pnpm payload info` or list your versions.
        Please use specific version numbers instead of "latest" to help us debug faster.
      placeholder: |
        @seshuk/payload-plugin-sitemap: 0.1.0
        payload: 3.90.2
        next: 16.4.0
        node: 22.18.0
        database adapter: @payloadcms/db-sqlite 3.90.2
        storage adapter: @payloadcms/storage-s3 3.90.2 (if used)
      render: shell
    validations:
      required: true

  - type: input
    id: code-link
    attributes:
      label: Link to reproduction code (if needed)
      description: Optional link to minimal reproduction repository
      placeholder: https://github.com/username/repo

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Error messages, stack traces, or console logs
      render: shell
